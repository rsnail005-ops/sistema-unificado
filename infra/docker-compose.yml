version: '3.8'

services:
  # Almacenamiento de Objetos S3 Local para Soberanía (MinIO)
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: paz_vida_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin_pazvida}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-SeguridadPazVida2026!}
      MINIO_BROWSER: "on"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - paz_vida_network

  # Cola en Memoria y Cache para Trabajos Asíncronos (Redis)
  redis:
    image: redis:7.2-alpine
    container_name: paz_vida_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-RedisPazVida2026!}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - paz_vida_network

  # Proxy Inverso y Terminación SSL
  nginx:
    image: nginx:alpine
    container_name: paz_vida_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - minio
    networks:
      - paz_vida_network

volumes:
  minio_data:
    driver: local
  redis_data:
    driver: local

networks:
  paz_vida_network:
    driver: bridge
